<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-label="Ahmed Jab — abstract brand panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1712"/>
      <stop offset="1" stop-color="#0b0a08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#e9b872" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#e9b872" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.42" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#f4d29a"/>
      <stop offset="0.55" stop-color="#e9b872"/>
      <stop offset="1" stop-color="#c8924a"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9b872"/>
      <stop offset="1" stop-color="#a9763a"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="640" height="800" fill="url(#bg)"/>
  <rect width="640" height="800" fill="url(#glow)"/>

  <!-- faint blueprint grid -->
  <g stroke="#e9b872" stroke-opacity="0.05" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="0" y1="200" x2="640" y2="200"/>
    <line x1="0" y1="560" x2="640" y2="560"/>
  </g>

  <!-- orbit ring + sun -->
  <circle cx="320" cy="320" r="184" fill="none" stroke="#e9b872" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="320" cy="320" r="150" fill="url(#orb)"/>

  <!-- horizon (rising form) -->
  <line x1="64" y1="560" x2="576" y2="560" stroke="#e9b872" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M150 768c0-104 76-188 170-188s170 84 170 188z" fill="url(#horizon)"/>

  <!-- monogram + decorative quote mark -->
  <text x="56" y="92" font-family="'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="2" fill="#f3f0ea">AJ</text>
  <text x="588" y="96" text-anchor="end" font-family="Georgia,'Times New Roman',serif" font-size="92" font-weight="700" fill="#e9b872" fill-opacity="0.16">&#8221;</text>
</svg>
